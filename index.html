<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Notification</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}

/* Video fullscreen */
#video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;

    object-fit: contain;  /* no cropping */
    background: black;

    display: none;
}
</style>
</head>

<body>

<!-- Video -->
<video id="video" playsinline>
    <source src="jamir.mp4" type="video/mp4">
</video>

<script>
window.onload = () => {
    setTimeout(() => {
        alert("You are now accessing job_notification");

        let video = document.getElementById("video");
        video.style.display = "block";

        video.muted = false; // sound ON
        video.play();
    }, 1000); // 1 second delay
};
</script>

</body>
</html>
