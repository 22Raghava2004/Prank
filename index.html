<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#loader {
    text-align: center;
}

.spinner {
    border: 6px solid #333;
    border-top: 6px solid white;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    margin: 20px auto;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

#video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: none;
}
</style>
</head>

<body>

<div id="loader">
    <h2>Tap to continue...</h2>
    <div class="spinner"></div>
</div>

<video id="video" playsinline>
    <source src="jamir.mp4" type="video/mp4">
</video>

<script>
document.body.addEventListener("click", () => {
    document.getElementById("loader").style.display = "none";

    let video = document.getElementById("video");
    video.style.display = "block";
    video.muted = false; // sound ON
    video.play();
});
</script>

</body>
</html>
