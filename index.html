<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Notification</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}

#video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: black;
    display: none;
}
</style>
</head>

<body>

<video id="video" playsinline>
    <source src="khan.mp4" type="video/mp4">
</video>

<script>
window.onload = () => {
    setTimeout(() => {
        alert("You are now accessing job notification");

        const video = document.getElementById("video");
        video.style.display = "block";

        
        video.load();

        let playPromise = video.play();

        if (playPromise !== undefined) {
            playPromise.then(() => {
                console.log("Video started");
            }).catch(() => {
                console.log("Autoplay blocked");
            });
        }

    }, 1000);
};
</script>

</body>
</html>
