<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Notification</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Fake popup */
#popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    color: black;
    width: 300px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

#popup h3 {
    margin: 0 0 10px;
}

.buttons {
    margin-top: 15px;
}

button {
    padding: 8px 15px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.allow {
    background: #007bff;
    color: white;
}

.block {
    background: #ccc;
}

/* Video fullscreen */
#video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: black;
    display: none;
}
</style>
</head>

<body>

<!-- Fake Notification Popup -->
<div id="popup">
    <h3>Allow Notifications</h3>
    <p>job_notification wants to send notifications</p>
    
    <div class="buttons">
        <button class="block" onclick="startVideo()">Block</button>
        <button class="allow" onclick="startVideo()">Allow</button>
    </div>
</div>

<!-- Video -->
<video id="video" playsinline>
    <source src="khan.mp4" type="video/mp4">
</video>

<script>
function startVideo() {
    document.getElementById("popup").style.display = "none";

    let video = document.getElementById("video");
    video.style.display = "block";

    video.muted = false; // sound ON
    video.play();
}
</script>

</body>
</html>
